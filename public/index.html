<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Трінька Онлайн</title>
    <script src="https://telegram.org"></script>
    <style>
        body { background: #123329; color: #fff; font-family: sans-serif; margin: 0; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; height: 100vh; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.45); padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: bold; }
        .lobby { margin: auto 0; text-align: center; }
        .lobby input, .lobby select { width: 85%; max-width: 280px; padding: 12px; margin: 6px 0; border-radius: 10px; border: none; font-size: 15px; text-align: center; }
        .game { display: none; flex-direction: column; justify-content: space-between; height: 100%; }
        .players-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); gap: 6px; max-height: 36vh; overflow-y: auto; margin: 6px 0; }
        .p-box { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 6px; text-align: center; font-size: 11px; }
        .p-box.active-turn { border: 2px solid #2ecc71; }
        .p-box.folded { opacity: 0.45; }
        .mini-cards { display: flex; justify-content: center; gap: 3px; margin-top: 4px; }
        .mc { background: #fff; color: #000; border-radius: 3px; padding: 1px 3px; font-weight: bold; font-size: 10px; }
        .mc.red { color: #d32f2f; }
        .pot-box { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,215,0,0.4); border-radius: 12px; padding: 8px; text-align: center; }
        .pot { font-size: 20px; font-weight: bold; color: #ffd700; }
        .status { background: rgba(0,0,0,0.5); padding: 8px; border-radius: 8px; font-size: 12px; text-align: center; }
        .cards-row { display: flex; justify-content: center; gap: 8px; margin: 6px 0; }
        .card { width: 64px; height: 92px; background: #fff; color: #000; border-radius: 7px; display: flex; flex-direction: column; justify-content: space-between; padding: 5px; box-sizing: border-box; font-size: 16px; font-weight: bold; }
        .card.red { color: #d32f2f; }
        .card.joker { border: 2px solid #ffd700; background: #fffdf0; }
        .card.hidden { background: #2b4c65; color: transparent; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        button { padding: 12px 8px; border: none; border-radius: 9px; font-size: 14px; font-weight: bold; color: #fff; }
        button:disabled { opacity: 0.4; }
        .btn-green { background: #2ecc71; }
        .btn-purple { background: #8e44ad; }
        .btn-blue { background: #2980b9; }
        .btn-orange { background: #f39c12; }
        .btn-red { background: #e74c3c; }
        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.94); z-index: 999; padding: 15px; box-sizing: border-box; overflow-y: auto; }
        .admin-card { background: #1e272e; padding: 10px; border-radius: 10px; margin-bottom: 10px; font-size: 13px; border: 1px solid #34495e; }
        .adm-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
        .adm-btn { padding: 7px 2px; font-size: 11px; border-radius: 6px; text-align: center; }
    </style>
</head>
<body>
<div class="header">
    <div>🟢 <span id="my-name">Гравець</span></div>
    <div style="font-size:11px; color:#ffd700; cursor:pointer;" onclick="openAdmin()">👑 Каса 3%: <span id="admin-rake">0</span></div>
    <div>Фішки: <span id="my-balance">1000</span></div>
</div>
<div class="lobby" id="lobby">
    <h2>Трінька Онлайн (Live)</h2>
    <p style="font-size:13px; color:#bdc3c7;">Введи своє ім'я та номер столу</p>
    <input type="text" id="name-input" placeholder="Твоє ім'я">
    <input type="text" id="room-input" placeholder="Номер столу" value="777">
    <select id="seats-select">
        <option value="2">Стіл на 2 гравців</option>
        <option value="4">Стіл на 4 гравців</option>
        <option value="6" selected>Стіл на 6 гравців</option>
        <option value="9">Стіл на 9 гравців</option>
        <option value="12">Стіл на 12 гравців</option>
    </select>
    <br>
    <button type="button" class="btn-green" id="btn-sit" style="width:85%; max-width:280px; margin-top:10px;">Сісти за стіл</button>
</div>
<div class="game" id="game">
    <div style="font-size:12px; color:#bdc3c7; text-align:center;">Стіл #<b id="lbl-room"></b> • Місць: <b id="lbl-seats"></b></div>
    <div class="players-grid" id="players-grid"></div>
    <div class="pot-box">
        <div class="pot">Банк: <span id="pot">0</span> фішок</div>
        <div style="font-size:11px; color:#a3c2b8;">Комісія столу: 3% від банку</div>
    </div>
    <div class="status" id="status">Очікування гравців...</div>
    <div style="text-align:center;">
        <div style="font-size:12px;">Ваші карти (Очки: <b id="my-score">?</b>)</div>
        <div class="cards-row" id="my-cards"></div>
    </div>
    <div class="controls" id="controls"></div>
</div>
<div class="admin-modal" id="admin-modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="margin:0; color:#ffd700;">👑 Адмін-панель</h3>
        <button class="btn-red" style="padding:6px 10px; font-size:12px;" onclick="document.getElementById('admin-modal').style.display='none'">Закрити ✖</button>
    </div>
    <div style="background:#2f3640; padding:10px; border-radius:8px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
        <span>Накопичено комісії (3%): <b id="adm-rake-val" style="color:#ffd700;">0</b></span>
        <button class="btn-orange" style="padding:6px 10px; font-size:12px;" onclick="resetRake()">Зняти касу</button>
    </div>
    <div id="admin-users-list"></div>
</div>
<script>
    var tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }
    var savedId = localStorage.getItem('trinka_pid');
    if (!savedId) { savedId = 'p_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('trinka_pid', savedId); }
    var playerId = savedId;
    var userName = localStorage.getItem('trinka_name') || '';
    var adminPass = localStorage.getItem('trinka_adm') || '';

    function syncTgUser() {
        try {
            var u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
            if (!u && tg && tg.initData) {
                var us = new URLSearchParams(tg.initData).get('user');
                if (us) u = JSON.parse(us);
            }
            if (u) {
                playerId = 'tg_' + u.id;
                localStorage.setItem('trinka_pid', playerId);
                var fn = (u.first_name || '') + (u.last_name ? ' ' + u.last_name : '');
                if (!fn.trim() && u.username) fn = '@' + u.username;
                if (fn.trim()) { userName = fn.trim(); localStorage.setItem('trinka_name', userName); }
            }
        } catch (e) {}
        var ni = document.getElementById('name-input');
        if (userName && !ni.value) ni.value = userName;
        document.getElementById('my-name').innerText = ni.value.trim() || userName || 'Гравець';
        fetch('/api/profile', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ playerId: playerId, userName: document.getElementById('my-name').innerText }) })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            document.getElementById('my-balance').innerText = d.balance;
            document.getElementById('admin-rake').innerText = d.adminRake;
        });
    }
    syncTgUser();

    function openAdmin() {
        var p = adminPass || prompt('Введіть пароль адміністратора:');
        if (!p) return;
        fetch('/api/admin/list', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pass: p }) })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.error) { alert(d.error); adminPass = ''; localStorage.removeItem('trinka_adm'); return; }
            adminPass = p; localStorage.setItem('trinka_adm', p);
            renderAdmin(d);
            document.getElementById('admin-modal').style.display = 'block';
        });
    }

    function renderAdmin(d) {
        document.getElementById('adm-rake-val').innerText = d.adminRake;
        document.getElementById('admin-rake').innerText = d.adminRake;
        var nums = new Array(100, 200, 300, 400, 500, 1000, 2000);
        var html = '';
        for (var i = 0; i < d.users.length; i++) {
            var u = d.users.at(i);
            if (u.id === playerId) document.getElementById('my-balance').innerText = u.balance;
            var plusBtns = '';
            var minusBtns = '';
            for (var n = 0; n < nums.length; n++) {
                var val = nums.at(n);
                plusBtns += '<button class="btn-green adm-btn" onclick="admDelta(\'' + u.id + '\',' + val + ')">+' + val + '</button>';
                minusBtns += '<button class="btn-red adm-btn" onclick="admDelta(\'' + u.id + '\',-' + val + ')">-' + val + '</button>';
            }
            html += '<div class="admin-card">' +
                '<div style="display:flex; justify-content:space-between;"><b>' + u.name + '</b><span style="color:#ffd700; font-weight:bold;">Баланс: ' + u.balance + '</span></div>' +
                '<div class="adm-grid">' + plusBtns + '</div>' +
                '<div class="adm-grid">' + minusBtns + '</div>' +
                '</div>';
        }
        document.getElementById('admin-users-list').innerHTML = html || '<p>Поки немає гравців</p>';
    }

    function admDelta(targetId, delta) {
        fetch('/api/admin/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pass: adminPass, targetId: targetId, delta: delta }) })
        .then(function(r) { return r.json(); })
        .then(function(d) { renderAdmin(d); });
    }

    function resetRake() {
        fetch('/api/admin/resetRake', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pass: adminPass }) })
        .then(function(r) { return r.json(); })
        .then(function(d) { renderAdmin(d); });
    }
    var currentRoom = '';
    var pollTimer = null;

    document.getElementById('btn-sit').onclick = function() {
        var iv = document.getElementById('name-input').value.trim();
        if (iv) { userName = iv; localStorage.setItem('trinka_name', userName); }
        else if (!userName) { userName = 'Гравець_' + Math.floor(Math.random() * 999); }
        document.getElementById('my-name').innerText = userName;
        currentRoom = document.getElementById('room-input').value.trim() || '777';
        var maxSeats = document.getElementById('seats-select').value;
        document.getElementById('lbl-room').innerText = currentRoom;
        document.getElementById('lbl-seats').innerText = '1/' + maxSeats;
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'flex';
        fetch('/api/join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ roomId: currentRoom, maxSeats: maxSeats, playerId: playerId, userName: userName }) })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) { alert(data.error); document.getElementById('game').style.display = 'none'; document.getElementById('lobby').style.display = 'block'; return; }
            fetchState();
            if (!pollTimer) pollTimer = setInterval(fetchState, 1000);
        });
    };

    function sendAction(action, isDarkBet) {
        fetch('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ roomId: currentRoom, playerId: playerId, action: action, isDarkBet: !!isDarkBet }) }).then(function() { fetchState(); });
    }

    function fetchState() {
        if (!currentRoom) return;
        fetch('/api/state?roomId=' + encodeURIComponent(currentRoom) + '&playerId=' + encodeURIComponent(playerId))
        .then(function(r) { return r.json(); })
        .then(function(state) {
            if (state.error) return;
            document.getElementById('lbl-room').innerText = state.roomId;
            document.getElementById('lbl-seats').innerText = state.players.length + '/' + state.maxSeats;
            document.getElementById('pot').innerText = state.pot;
            document.getElementById('status').innerText = state.message;
            document.getElementById('my-balance').innerText = state.myData.balance;
            document.getElementById('admin-rake').innerText = state.adminRake;
            document.getElementById('my-score').innerText = (state.myData.score !== null) ? state.myData.score : '? (В темну)';
            var grid = document.getElementById('players-grid');
            var gridHtml = '';
            for (var i = 0; i < state.players.length; i++) {
                var p = state.players.at(i);
                var isTurn = (p.id === state.turnId && state.gameActive);
                var cardsHtml = '';
                if (p.hand) { for (var j = 0; j < p.hand.length; j++) { var c = p.hand.at(j); cardsHtml += '<div class="mc ' + (c.isRed ? 'red' : '') + '">' + c.rank + c.suit + '</div>'; } }
                gridHtml += '<div class="p-box ' + (isTurn ? 'active-turn ' : '') + (p.folded ? 'folded' : '') + '"><div style="font-weight:bold;">' + p.name + (isTurn ? ' ⏳' : '') + '</div><div style="color:#f1c40f;">' + ((p.score !== null && !p.folded) ? (p.score + ' очк.') : p.status) + '</div><div style="color:#bdc3c7;">' + p.balance + ' фішок</div><div class="mini-cards">' + cardsHtml + '</div></div>';
            }
            grid.innerHTML = gridHtml;
            var myCardsEl = document.getElementById('my-cards');
            myCardsEl.innerHTML = '';
            var myHand = state.myData.hand || [];
            for (var k = 0; k < myHand.length; k++) {
                var mc = myHand.at(k);
                var div = document.createElement('div');
                if (state.myData.isDark && !state.reveal) { div.className = 'card hidden'; }
                else { div.className = 'card' + (mc.isRed ? ' red' : '') + (mc.isJoker ? ' joker' : ''); div.innerHTML = '<div>' + mc.rank + mc.suit + '</div><div style="text-align:right">' + mc.rank + mc.suit + '</div>'; }
                myCardsEl.appendChild(div);
            }
            var ctrl = document.getElementById('controls');
            var isMyTurn = (state.turnId === state.myData.id);
            if (!state.gameActive) {
                ctrl.innerHTML = '<button type="button" class="btn-green" style="grid-column: span 2;" onclick="sendAction(\'start\')" ' + (state.players.length < 2 ? 'disabled' : '') + '>' + (state.isSvara ? '🔥 Почати СВАРУ (50 фішок)' : 'Почати роздачу (мін. 2 чол.)') + '</button>';
            } else {
                ctrl.innerHTML = '<button type="button" class="btn-purple" onclick="sendAction(\'bet\', true)" ' + ((!isMyTurn || !state.myData.isDark) ? 'disabled' : '') + '>В темну (+50)</button><button type="button" class="btn-blue" onclick="sendAction(\'look\')" ' + (!state.myData.isDark ? 'disabled' : '') + '>Дивитись карти</button><button type="button" class="btn-green" onclick="sendAction(\'bet\', false)" ' + (!isMyTurn ? 'disabled' : '') + '>Підняти (+100)</button><button type="button" class="btn-orange" onclick="sendAction(\'showdown\')" ' + (!isMyTurn ? 'disabled' : '') + '>Відкритись (50)</button><button type="button" class="btn-red" style="grid-column: span 2;" onclick="sendAction(\'fold\')" ' + (!isMyTurn ? 'disabled' : '') + '>Впасти ❌</button>';
            }
        });
    }
</script>
</body>
</html>
